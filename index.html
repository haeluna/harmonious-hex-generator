<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonious Hex Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="app-container">
        <header class="title-container">
            <h1>Color Harmony Generator</h1>
            <p>Generate beautiful, WCAG-compliant color palettes.</p>
        </header>

        <main class="color-generator">
            <div class="palette-container" id="palette-container">
                <!-- Color Box 1 -->
                <div class="color-box" id="box-0">
                    <div class="color-info">
                        <h2 class="hex-code">#------</h2>
                        <button class="copy-btn" aria-label="Copy color code">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-copy">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Color Box 2 -->

    <script src="./index.js"></script>
